name: Chen Sheng V82 narration timing audit
on:
  push:
    paths:
      - 'chen_sheng_full/transcribe.py'
      - '.github/workflows/chen_sheng_timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ASR and FFmpeg
        run: |
          python -m pip install faster-whisper
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m py_compile chen_sheng_full/transcribe.py
      - name: Transcribe timing with original audio
        run: python chen_sheng_full/transcribe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChenSheng-V82-Timing-QA
          path: |
            chen_sheng_full/timing/asr_draft.srt
            chen_sheng_full/timing/asr_segments.json
          retention-days: 30
