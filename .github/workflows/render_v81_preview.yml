name: Render Holodomor Map Story V8.1 — 5s map-first higher-resolution preview
on:
  push:
    paths:
      - 'render_preview_v81.py'
      - '.github/workflows/render_v81_preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out public render code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow CairoSVG
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Doctor — tools and input rules
        run: |
          python - <<'PY'
          import shutil, sys
          from PIL import Image, features
          assert shutil.which("ffmpeg"), "Missing ffmpeg"
          assert shutil.which("ffprobe"), "Missing ffprobe"
          assert sys.version_info >= (3,11)
          print("Python:",sys.version)
          print("Pillow:",Image.__version__)
          print("RAQM:",features.check("raqm"))
          print("ffmpeg:",shutil.which("ffmpeg"))
          PY
      - name: Produce five-second GIS + satellite animation
        run: python render_preview_v81.py
      - name: Upload MP4 plus encoded-frame QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holodomor-v81-5sec-preview
          path: dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish public silent preview for direct viewing
        if: success()
        run: |
          mkdir -p preview-v81
          cp dist/Holodomor_V81_5sec_SILENT_preview.mp4 preview-v81/
          cp dist/start.jpg dist/middle.jpg dist/end.jpg preview-v81/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v81/Holodomor_V81_5sec_SILENT_preview.mp4 preview-v81/start.jpg preview-v81/middle.jpg preview-v81/end.jpg
          git commit -m "Publish verified V8.1 five-second map-first preview"
          git pull --rebase origin main
          git push
