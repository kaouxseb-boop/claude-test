name: Render Chen Sheng V8 5s 60fps
on:
  push:
    paths:
      - 'chen_sheng_60fps/render.py'
      - '.github/workflows/render_chen_sheng_60fps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and syntax
        run: |
          python -m pip install Pillow
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m py_compile chen_sheng_60fps/render.py
      - name: Render and verify
        run: python chen_sheng_60fps/render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChenSheng-V8-5s-60FPS
          path: |
            chen_sheng_60fps/output/V8_ChenSheng_5sec_60FPS.mp4
            chen_sheng_60fps/output/contact_sheet.jpg
            chen_sheng_60fps/output/qa.json
          retention-days: 30
      - name: Publish only verified 60fps files
        if: success()
        run: |
          mkdir -p chen_sheng_60fps/preview
          cp chen_sheng_60fps/output/V8_ChenSheng_5sec_60FPS.mp4 chen_sheng_60fps/preview/
          cp chen_sheng_60fps/output/contact_sheet.jpg chen_sheng_60fps/preview/
          cp chen_sheng_60fps/output/qa.json chen_sheng_60fps/preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chen_sheng_60fps/preview/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Chen Sheng V8 60fps test"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
